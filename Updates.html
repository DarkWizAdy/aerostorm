   <!-- UPDATES FEED -->
   <main class="w-full bg-[#0a0a0a] min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-16">
      <div id="updates-feed" class="grid gap-12"></div>
      <div id="older-updates" class="hidden grid gap-12 mt-12"></div>

      <!-- Pagination/More -->
      <div id="load-more-wrap" class="mt-16 hidden justify-center">
        <button id="load-more-updates" class="border border-[#434343] text-[#bababa] px-8 py-3 text-sm font-bold tracking-wide uppercase hover:border-[#e0d2b3] hover:text-[#e0d2b3] transition-colors rounded-sm">Load More Updates</button>
      </div>

      <script>
        (function(){
          var RECENT_COUNT = 2;

          function cardHtml(update, isFirst) {
            var thumb = update.image
              ? '<img src="' + update.image + '" alt="' + update.title + '" class="h-full w-full object-contain">'
              : '<i data-lucide="' + (update.icon || 'file-text') + '" style="width:48px;height:48px;"></i>';
            var linkAttrs = update.pdf ? ('href="' + update.pdf + '" target="_blank" rel="noopener"') : 'href="#"';
            var borderClass = isFirst ? '' : ' border-t border-[#1e1e1e] pt-12';
            return (
              '<article class="grid md:grid-cols-[300px_1fr] gap-8 items-start group' + borderClass + '">' +
                '<div class="aspect-video md:aspect-square bg-[#111111] border border-[#1e1e1e] rounded-sm overflow-hidden">' +
                  '<div class="w-full h-full flex items-center justify-center text-[#2c2c2c]">' + thumb + '</div>' +
                '</div>' +
                '<div class="flex flex-col gap-3">' +
                  '<div class="flex items-center gap-4">' +
                    '<span class="font-mono text-xs text-[#d0bd92]">' + update.displayDate + '</span>' +
                    '<span class="px-2 py-0.5 rounded-full border border-[#e0d2b3]/20 text-[10px] text-[#e0d2b3] font-mono uppercase">' + update.category + '</span>' +
                  '</div>' +
                  '<h2 class="text-2xl font-bold text-white group-hover:text-[#e0d2b3] transition-colors underline-offset-4 group-hover:underline">' + update.title + '</h2>' +
                  '<p class="text-[#727272] leading-relaxed">' + update.summary + '</p>' +
                  '<a ' + linkAttrs + ' class="inline-flex items-center gap-2 text-sm font-bold text-[#e0d2b3] mt-2">Read Full Update <i data-lucide="arrow-right" style="width:14px;height:14px;"></i></a>' +
                '</div>' +
              '</article>'
            );
          }

          fetch('updates.json')
            .then(function(res){ return res.json(); })
            .then(function(updates){
              updates.sort(function(a, b){ return new Date(b.date) - new Date(a.date); });

              var feed = document.getElementById('updates-feed');
              var older = document.getElementById('older-updates');
              var loadMoreWrap = document.getElementById('load-more-wrap');
              var btn = document.getElementById('load-more-updates');

              var recent = updates.slice(0, RECENT_COUNT);
              var rest = updates.slice(RECENT_COUNT);

              feed.innerHTML = recent.map(function(u, i){ return cardHtml(u, i === 0); }).join('');

              if (rest.length > 0) {
                older.innerHTML = rest.map(function(u, i){ return cardHtml(u, i === 0); }).join('');
                loadMoreWrap.classList.remove('hidden');
                loadMoreWrap.classList.add('flex');
                btn.addEventListener('click', function(){
                  var isHidden = older.classList.toggle('hidden');
                  btn.textContent = isHidden ? 'Load More Updates' : 'Show Less';
                });
              }

              if (window.lucide) lucide.createIcons();
            })
            .catch(function(err){
              console.error('Failed to load updates.json', err);
            });
        })();
      </script>
