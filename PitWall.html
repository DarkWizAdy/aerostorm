<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pit Wall - Aerostorm Racing</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,400..900;1,400..900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --primary-gold: #e0d2b3;
      --primary-gold-darker: #d0bd92;
      --dark-bg: #000000;
      --dark-card: #111111;
      --dark-border: #1e1e1e;
      --text-white: #e8e8e8;
      --text-muted: #bababa;
      --lights-green: #2fbf71;
    }
    .checker {
      height: 12px;
      background-image:
        linear-gradient(45deg, var(--text-white) 25%, transparent 25%, transparent 75%, var(--text-white) 75%),
        linear-gradient(45deg, var(--text-white) 25%, var(--dark-bg) 25%, var(--dark-bg) 75%, var(--text-white) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .live-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: var(--lights-green); margin-right: 8px;
      box-shadow: 0 0 8px var(--lights-green);
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .join-panel {
      display: flex; align-items: center; gap: 14px;
      background: #111111;
      border: 1px solid #1e1e1e;
      border-radius: 4px;
      padding: 12px 20px 12px 12px;
      transition: border-color 0.3s ease;
    }
    .join-panel:hover {
      border-color: #e0d2b3;
    }
    .join-panel img { width: 78px; height: 78px; border-radius: 4px; display: block; background: #1e1e1e; }
    .join-text { font-family: 'MuseoModerno', sans-serif; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 0.02em; color: var(--text-white); }
    .join-text span { display: block; font-family: 'Outfit', sans-serif; text-transform: none; color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; font-weight: 400; letter-spacing: 0; }
    #grid {
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
      align-content: start;
    }
    .tile {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      background: #111111;
      border: 1px solid #1e1e1e;
      animation: pop 0.45s cubic-bezier(.2,.9,.3,1.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .tile:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      border-color: #e0d2b3;
    }
    .tile::before {
      content: "";
      display: block;
      padding-top: 100%;
    }
    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #empty {
      color: var(--text-muted);
      font-family: 'MuseoModerno', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      text-align: center;
      padding-top: 60px;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body class="h-full bg-[#000000] text-[#e8e8e8] font-heading overflow-auto" id="top">
  <div id="app-wrapper" class="w-full" style="min-height:100%;">
    <!-- NAV -->
    <nav class="fixed top-0 left-0 w-full z-50 bg-[#000000]/90 backdrop-blur-md border-b border-[#1e1e1e]">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-[#e0d2b3] rounded-sm flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
          </div>
          <a href="HomePage.html" class="text-lg font-bold tracking-tight text-white hover:text-[#e0d2b3] transition-colors flex items-center gap-2">
            <img src="aerostormLogoNoBG.png" alt="Aerostorm" class="h-8 w-auto">
            <span style="margin-top: 1px; font-size: 1.5rem;" class="font-racing">racing</span>
          </a>
        </div>
        <div class="flex items-center gap-4">
          <a href="JoinTheGrid.html" class="group inline-flex items-center border border-[#434343] text-[#d9d9d9] px-4 py-2 text-sm font-bold tracking-wide uppercase hover:bg-[#e0d2b3] hover:text-[#000000] hover:border-[#e0d2b3] transition-all duration-300 rounded-sm">
            Join Grid
          </a>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <section class="w-full bg-[#0a0a0a]" style="padding-top: 100px;">
      <div class="checker"></div>
      <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex flex-col items-start gap-2 mb-8">
          <div class="flex items-center gap-3 mb-2">
            <span class="live-dot"></span>
            <span class="font-mono text-xs tracking-[0.3em] text-[#d0bd92] uppercase">Live</span>
          </div>
          <h1 class="text-4xl md:text-5xl font-extrabold text-white leading-tight">
            <span class="font-racing text-[#e0d2b3]">Pit</span> Wall
          </h1>
        </div>

        <div id="grid" class="min-h-[50vh]">
          <div id="empty">Be the first on the wall — tap "Join the Grid" to start.</div>
        </div>
      </div>
      <div class="checker"></div>
    </section>

    <!-- FOOTER -->
    <footer class="w-full bg-[#000000] border-t border-[#1e1e1e]">
      <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-6 h-6 bg-[#e0d2b3] rounded-sm flex items-center justify-center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
          </div>
          <span class="text-sm text-[#636363] font-mono">© 2026 Aerostorm racing</span>
        </div>
        <div class="text-xs text-[#434343] font-mono tracking-wide">
          ENGINEERED WITH PRECISION
        </div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const knownPhotos = new Set();

    function addPhoto(url) {
      if (knownPhotos.has(url)) return;
      knownPhotos.add(url);
      if (empty) empty.remove();
      const tile = document.createElement('div');
      tile.className = 'tile';
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      img.alt = 'Grid photo';
      tile.appendChild(img);
      grid.appendChild(tile);
      grid.scrollTop = grid.scrollHeight;
    }

    function loadPhotos() {
      const photos = JSON.parse(localStorage.getItem('photos') || '[]');
      if (!Array.isArray(photos) || photos.length === 0) return;
      photos.forEach(addPhoto);
    }

    loadPhotos();
    setInterval(loadPhotos, 3000);
  </script>
</body>
</html>
